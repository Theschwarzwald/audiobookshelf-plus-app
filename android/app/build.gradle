plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'kotlin-kapt'
}

kotlin {
  kotlinDaemonJvmArgs = [
    "-Dfile.encoding=UTF-8",
    "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
  ]

  jvmToolchain(17)
}

android {
  namespace 'com.audiobookshelf.app'
  buildFeatures {
    viewBinding true
    buildConfig true
  }
  kotlinOptions {
    freeCompilerArgs = ['-Xjvm-default=all']
  }
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.audiobookshelf.app.plus"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1139 // ABS+: 1000 + the build number in plugins/absPlusBuild.js, so each ABS+ APK installs as an update
    versionName "0.14.2-beta"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    manifestPlaceholders = [
      "appAuthRedirectScheme": "com.audiobookshelf.app"
    ]
    aaptOptions {
      // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
      // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
  mavenCentral()
}

configurations.configureEach {
  resolutionStrategy {
    force("com.google.android.gms:play-services-base:18.0.1")
    force("androidx.appcompat:appcompat:$androidxAppCompatVersion")
    force("androidx.core:core-ktx:$androidx_core_ktx_version")
    force("androidx.media:media:$androidx_media_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version")
  }
}

dependencies {
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation project(':capacitor-android')

  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

  implementation project(':capacitor-cordova-android-plugins')

  implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
  implementation "androidx.work:work-runtime-ktx:2.9.1"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

  implementation "androidx.media:media:$androidx_media_version"

  // Exo Player
  if (findProject(':exoplayer-library-core') != null) {
    implementation project(':exoplayer-library-core')
    implementation project(':exoplayer-library-ui')
    implementation project(':exoplayer-extension-mediasession')
    implementation project(':exoplayer-extension-cast')
    implementation project(':exoplayer-hls')
  } else {
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "com.google.android.exoplayer:extension-mediasession:$exoplayer_version"
    implementation "com.google.android.exoplayer:extension-cast:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exoplayer_version"
  }

  // Glide for images
  implementation "com.github.bumptech.glide:glide:$glide_version"

  // Paper NoSQL Db
  implementation 'io.github.pilgr:paperdb:2.7.2'

  // Simple Storage
  implementation "com.anggrayudi:storage:1.5.6"

  // OK HTTP
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'

  // Jackson for JSON
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.12.2'

  // Transcription: unpack sherpa-onnx model archives (.tar.bz2)
  implementation 'org.apache.commons:commons-compress:1.27.1'
  // XZ archives (FreeDict Arabic dictionary, built-in e-reader dictionaries)
  implementation 'org.tukaani:xz:1.10'
  // Foldables: hinge position and posture
  implementation 'androidx.window:window:1.3.0'
  // ABS+ screen lock: face / fingerprint / the phone's PIN
  implementation 'androidx.biometric:biometric:1.1.0'
  implementation 'androidx.window:window-java:1.3.0'
  // Transcription: DNS-over-HTTPS fallback for model downloads when the phone's DNS fails
  implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.9.2'
}

// ---------------------------------------------------------------------------------------
// On-device transcription engine: sherpa-onnx native libraries (Apache-2.0)
// https://github.com/k2-fsa/sherpa-onnx . The Kotlin API in com/k2fsa/sherpa/onnx is copied
// from the same tag, so keep SHERPA_ONNX_VERSION and those files in sync.
// ---------------------------------------------------------------------------------------
def SHERPA_ONNX_VERSION = '2.0.1'
def sherpaJniDir = file('src/main/jniLibs')
def sherpaMarker = file("src/main/jniLibs/.sherpa-onnx-${SHERPA_ONNX_VERSION}")

tasks.register('downloadSherpaOnnx') {
  description = 'Downloads the sherpa-onnx Android native libraries used for transcription'
  outputs.file(sherpaMarker)
  doLast {
    if (sherpaMarker.exists()) return
    def archive = new File(project.layout.buildDirectory.get().asFile, "sherpa-onnx-v${SHERPA_ONNX_VERSION}-android.tar.bz2")
    archive.parentFile.mkdirs()
    def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-android.tar.bz2"
    println "Downloading ${url}"
    new URL(url).withInputStream { i -> archive.withOutputStream { it << i } }
    def tmp = new File(project.layout.buildDirectory.get().asFile, 'sherpa-onnx-extract')
    project.delete(tmp)
    project.copy {
      from project.tarTree(project.resources.bzip2(archive))
      into tmp
    }
    // Archive layout: jniLibs/<abi>/*.so
    ['arm64-v8a', 'armeabi-v7a', 'x86_64'].each { abi ->
      def src = project.fileTree(tmp) { include "**/${abi}/*.so" }
      if (src.isEmpty()) throw new GradleException("sherpa-onnx archive is missing ${abi} libraries")
      project.copy {
        from src.files
        into new File(sherpaJniDir, abi)
      }
    }
    sherpaMarker.text = SHERPA_ONNX_VERSION
  }
}

// Silero VAD (~2 MB) is bundled in the APK so only the speech model itself has to be downloaded
def vadAsset = file('src/main/assets/transcription/silero_vad.onnx')
tasks.register('downloadSileroVad') {
  description = 'Bundles the Silero VAD model used to split audio into lines'
  outputs.file(vadAsset)
  doLast {
    if (vadAsset.exists() && vadAsset.length() > 0) return
    vadAsset.parentFile.mkdirs()
    def url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx'
    println "Downloading ${url}"
    def tmp = new File(vadAsset.path + '.part')
    new URL(url).withInputStream { i -> tmp.withOutputStream { it << i } }
    tmp.renameTo(vadAsset)
  }
}
tasks.named('preBuild') { dependsOn 'downloadSherpaOnnx', 'downloadSileroVad' }

apply from: 'capacitor.build.gradle'
