name: Release APK

# Builds the app and attaches the APK to a GitHub Release, so there's a normal download link.
#   - Push a tag like v6.0.0 (or run it by hand from the Actions tab).
#   - With the signing secrets below, the APK is a signed release build, and each new version installs
#     over the previous one. Without them it's a debug build (fine for trying it out, but every
#     build has a different signature, so you'd uninstall before installing the next one).
#
# Signing secrets (Settings → Secrets and variables → Actions), made once with keytool, see RELEASING.md:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build the web app (vendors foliate-js and pdf.js)
        run: npm run generate

      - name: Copy into the Android project
        run: npx cap sync android

      - name: Signing key
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building a debug APK"
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./android/gradlew assembleRelease -p android --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          mkdir -p dist && cp android/app/build/outputs/apk/release/*.apk dist/

      - name: Build debug APK
        if: steps.sign.outputs.signed != 'true'
        run: |
          ./android/gradlew assembleDebug -p android --no-daemon
          mkdir -p dist && cp android/app/build/outputs/apk/debug/*.apk dist/

      - name: Name the APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          kind=$([ "${{ steps.sign.outputs.signed }}" = "true" ] && echo "" || echo "-debug")
          for f in dist/*.apk; do mv "$f" "dist/audiobookshelf-transcription-${version}${kind}.apk"; done
          ls -la dist

      - name: Keep it as a workflow download too
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: dist/*.apk

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
