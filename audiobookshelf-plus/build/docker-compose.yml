# TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML (or `docker compose up -d` anywhere).
#
# Your phone and browser keep using the SAME address and port as before: the transcription container now
# takes Audiobookshelf's port and passes everything through to Audiobookshelf, adding transcription on top.
#
# 1. Replace the /mnt/pool/... paths with the ones your current Audiobookshelf app uses.
# 2. Set TZ=<your-timezone> (for example Europe/London), start it, and sign in once as an admin:
#    ABS+ creates its own API key then (ABS_API_KEY below is only needed to use a key of your own).
# 3. NVIDIA GPU: uncomment the `deploy:` block. Without it the container uses the CPU automatically.

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # Direct way in, and the port Portainer links to. Transcription features stay on 13378.
    ports:
      - "13379:80"
    environment:
      - TZ=<your-timezone>
    volumes:
      - /mnt/pool/media/audiobooks:/audiobooks
      - /mnt/pool/media/podcasts:/podcasts
      - /mnt/pool/apps/audiobookshelf/config:/config
      - /mnt/pool/apps/audiobookshelf/metadata:/metadata

  transcription:
    # Built by the GitHub workflow in this repo (Actions → Build image). Or build on the NAS:
    #   build: /mnt/pool/apps/abs-transcription
    image: ghcr.io/YOUR_GITHUB_USER/abs-transcription:latest
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    ports:
      - "13378:13378"   # the port your apps already use for Audiobookshelf
    environment:
      - ABS_URL=http://audiobookshelf:80
      # - ABS_API_KEY=<your-api-key>   # optional: only to use a key of your own (ABS+ makes one otherwise)
      - TRANSCRIBE_DEVICE=auto          # auto | cuda | cpu
      - TRANSCRIBE_ADMIN_ONLY=false     # true: only admins may start/delete server transcriptions
      - AUTO_EBOOK_CHECK=true
      - DICTIONARY_ONLINE=true          # look words up on Wiktionary when no dictionary here has them
      - TZ=<your-timezone>
    volumes:
      - /mnt/pool/apps/abs-transcription/data:/data      # transcripts
      - /mnt/pool/apps/abs-transcription/models:/models  # downloaded speech models (1-3 GB each)
      - /mnt/pool/apps/abs-transcription/dictionaries:/dictionaries  # StarDict dictionaries for the e-reader (en/, es/, …)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
