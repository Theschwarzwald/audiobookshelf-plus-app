<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Read along</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #121212;
        -webkit-tap-highlight-color: transparent;
      }
      #book {
        position: absolute;
        inset: 0;
      }
      /* Readium sizes nothing itself: each chapter frame fills the page */
      #book iframe,
      .readium-navigator-iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="book"></div>
    <script src="./readium.js"></script>
  </body>
</html>
