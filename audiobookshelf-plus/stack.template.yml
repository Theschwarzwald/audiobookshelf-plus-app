# ABS+ (Audiobookshelf Plus) stack
#
# 1. Set your paths: replace <path-to-audiobooks> and <your-timezone> (e.g. Etc/UTC) below.
# 2. Deploy: docker build -t audiobookshelf-plus:latest build  then  docker compose up -d  (or a Portainer stack).
# 3. Sign in once as admin at http://<your-server>:13378. ABS+ makes its own API key then.

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf-plus-abs
    restart: unless-stopped
    # No published port: only ABS+ talks to it. Add  ports: ["13379:80"]  for a direct way in.
    environment:
      - TZ=<your-timezone>
    volumes:
      - <path-to-audiobooks>:/audiobooks
      - abs_plus_config:/config
      - abs_plus_metadata:/metadata

  transcription:
    image: audiobookshelf-plus:latest
    pull_policy: never
    container_name: audiobookshelf-plus
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    ports:
      - "13378:13378"
    environment:
      - ABS_URL=http://audiobookshelf:80
      - ABS_CONTAINER=audiobookshelf-plus-abs   # the Audiobookshelf container ABS+ keeps up to date
      - TRANSCRIBE_DEVICE=auto
      - TRANSCRIBE_ADMIN_ONLY=false      # true: only admins may start server transcriptions
      - AUTO_EBOOK_CHECK=true
      - DICTIONARY_ONLINE=true
      - TZ=<your-timezone>
    # The transcripts folder sits inside the library, so it gets a .ignore file first:
    # Audiobookshelf skips folders that contain one and won't list it as a book.
    entrypoint: ["/bin/sh", "-c", "touch /data/.ignore; exec /usr/bin/tini -- node /app/server/src/index.js"]
    volumes:
      # The library, read-write and at the same path Audiobookshelf uses, so <audio>.lrc and
      # <audio>_karaoke.lrc can be saved next to each audio file
      - <path-to-audiobooks>:/audiobooks
      - <path-to-audiobooks>/transcriptions:/data   # transcripts, settings and the ABS+ API key
      - abs_plus_models:/models             # speech models, downloaded on first use
      - abs_plus_dictionaries:/dictionaries # StarDict dictionaries for the e-reader
      - abs_plus_catalog:/catalog           # Open Library catalogue copy (Settings > Library catalogue), 6-10 GB once built
      # Lets ABS+ update the Audiobookshelf container (Settings > Server updates). Remove this line to only check.
      - /var/run/docker.sock:/var/run/docker.sock
    # NVIDIA GPU (optional): uncomment, with the NVIDIA Container Toolkit installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  abs_plus_config:
  abs_plus_metadata:
  abs_plus_models:
  abs_plus_dictionaries:
  abs_plus_catalog:
